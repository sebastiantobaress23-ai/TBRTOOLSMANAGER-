<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo · TBR Tools</title>
<meta name="description" content="Catálogo de productos TBR Tools">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Rajdhani:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;--bg1:#101010;--bg2:#161616;--bg3:#1c1c1c;
  --b1:#222;--b2:#2c2c2c;
  --ch:#f1f1ef;--si:#aaa;--di:#6e6e6e;
  --gd:#e2c97e;--gd2:#f3e3b3;
  --gr:#4ade80;--ye:#fbbf24;--re:#f87171;
  --r:10px;--r2:14px;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--ch);
  font-family:'Barlow',sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* ── ambient glow ── */
.glow{position:fixed;top:-30vh;left:50%;width:140vw;height:80vh;transform:translateX(-50%);
  background:radial-gradient(closest-side,rgba(226,201,126,.10),transparent 70%);
  pointer-events:none;z-index:0;filter:blur(10px)}

/* ── top bar ── */
.bar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:14px;
  padding:14px clamp(20px,5vw,56px);padding-top:max(14px,env(safe-area-inset-top));
  background:rgba(10,10,10,0);border-bottom:1px solid transparent;
  transition:background .35s var(--ease),border-color .35s var(--ease),backdrop-filter .35s var(--ease);}
.bar.on{background:rgba(10,10,10,.72);border-bottom-color:rgba(255,255,255,.06);backdrop-filter:blur(14px)}
.bar-name{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;letter-spacing:4px;
  text-transform:uppercase;color:var(--ch);flex-shrink:0}
.bar-name span{color:var(--gd)}
.bar-search{flex:1;max-width:340px;margin-left:auto;position:relative}
.bar-search input{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  border-radius:999px;padding:9px 16px 9px 36px;color:var(--ch);font-family:'Barlow',sans-serif;font-size:13px;
  outline:none;transition:border-color .2s,background .2s}
.bar-search input:focus{border-color:rgba(226,201,126,.4);background:rgba(255,255,255,.06)}
.bar-search input::placeholder{color:var(--di)}
.bar-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--di);pointer-events:none}

/* ── hero ── */
.hero{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;
  justify-content:center;padding:0 clamp(20px,6vw,64px);text-align:center}
.hero-inner{max-width:760px;margin:0 auto}
.hero-co{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:3px;color:var(--di);
  text-transform:uppercase;opacity:0;animation:upIn .7s var(--ease) .1s forwards}
.hero-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;
  font-size:clamp(3rem,14vw,6rem);line-height:.98;letter-spacing:-1px;margin-top:10px;
  text-wrap:balance;opacity:0;animation:upIn .8s var(--ease) .22s forwards}
.hero-title .gd{color:var(--gd)}
.hero-sub{margin-top:22px;font-size:clamp(15px,2.4vw,18px);color:var(--si);font-weight:400;
  max-width:46ch;margin-left:auto;margin-right:auto;line-height:1.6;
  opacity:0;animation:upIn .8s var(--ease) .36s forwards}
.hero-meta{margin-top:34px;display:flex;justify-content:center;gap:28px;flex-wrap:wrap;
  opacity:0;animation:upIn .8s var(--ease) .48s forwards}
.hero-meta div{font-family:'Rajdhani',sans-serif}
.hero-meta b{display:block;font-size:28px;font-weight:800;color:var(--gd);line-height:1.1}
.hero-meta span{display:block;font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:2px;
  text-transform:uppercase;color:var(--di);margin-top:4px}
@keyframes upIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.hero-scroll{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--di);
  opacity:0;animation:upIn .8s var(--ease) .7s forwards}
.hero-scroll-line{width:1px;height:34px;background:linear-gradient(180deg,rgba(226,201,126,.5),transparent);
  animation:scrollLine 1.8s var(--ease) infinite}
.hero-scroll-t{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase}
@keyframes scrollLine{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}
  50.01%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* ── grid ── */
.section{position:relative;z-index:1;padding:40px clamp(20px,5vw,56px) 100px;max-width:1320px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}
.card{
  background:linear-gradient(165deg,var(--bg3),var(--bg1));
  border:1px solid rgba(255,255,255,.06);border-radius:var(--r2);overflow:hidden;
  display:flex;flex-direction:column;
  opacity:0;transform:translateY(28px) scale(.98);
  transition:opacity .65s var(--ease),transform .65s var(--ease),
    border-color .3s,box-shadow .3s;
  cursor:default;
}
.card.feat{grid-column:span 2}
@media(max-width:680px){.card.feat{grid-column:span 1}}
.card.in{opacity:1;transform:translateY(0) scale(1)}
.card:hover{border-color:rgba(226,201,126,.32);box-shadow:0 20px 50px -28px rgba(226,201,126,.35)}
.card:hover .ph img{transform:scale(1.06)}
.card:hover .ph::after{transform:translateX(120%)}

.ph{position:relative;aspect-ratio:4/3;overflow:hidden;background:linear-gradient(150deg,var(--bg3),var(--bg1))}
.card.feat .ph{aspect-ratio:16/9}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s var(--ease)}
.ph-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:'Rajdhani',sans-serif;font-weight:800;font-size:18px;letter-spacing:2px;
  color:rgba(226,201,126,.28);text-transform:uppercase;text-align:center;padding:0 18px}
.ph::after{content:'';position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.10) 50%,transparent 58%);
  transform:translateX(-120%);transition:transform .9s var(--ease);pointer-events:none}
.ph-badge{position:absolute;top:12px;left:12px;font-family:'Barlow Condensed',sans-serif;font-size:10px;
  font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:5px 10px;border-radius:999px;
  background:rgba(10,10,10,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.1)}
.ph-badge.g{color:var(--gr);border-color:rgba(74,222,128,.3)}
.ph-badge.y{color:var(--ye);border-color:rgba(251,191,36,.3)}
.ph-badge.r{color:var(--re);border-color:rgba(248,113,113,.3)}

.card-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;letter-spacing:.5px;
  text-transform:uppercase;line-height:1.25;text-wrap:pretty}
.card.feat .card-name{font-size:22px}
.card-code{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1.5px;color:var(--di)}
.card-price{margin-top:auto;padding-top:10px;font-family:'Rajdhani',sans-serif;font-weight:800;
  font-size:clamp(22px,4vw,28px);color:var(--gd);letter-spacing:-.5px}
.card.feat .card-price{font-size:clamp(28px,4vw,36px)}

@media(prefers-reduced-motion:reduce){
  .hero-co,.hero-title,.hero-sub,.hero-meta,.hero-scroll{animation:none;opacity:1}
  .hero-scroll-line{animation:none;transform:scaleY(1)}
  .card{transition:opacity .3s linear;transform:none}
  .card.in{opacity:1}
  .ph img,.ph::after{transition:none}
}

/* ── footer ── */
.foot{position:relative;z-index:1;border-top:1px solid rgba(255,255,255,.06);
  padding:40px clamp(20px,5vw,56px) max(40px,env(safe-area-inset-bottom));
  display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center}
.foot-co{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:2px;
  text-transform:uppercase;color:var(--di)}
.foot-co b{color:var(--ch)}
.foot-cta{display:inline-flex;align-items:center;gap:10px;background:var(--gd);color:#1a1206;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:2px;
  text-transform:uppercase;text-decoration:none;padding:13px 24px;border-radius:999px;
  transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.foot-cta:hover{transform:translateY(-2px);box-shadow:0 10px 30px -10px rgba(226,201,126,.5)}

.empty{text-align:center;padding:60px 20px;color:var(--di);font-family:'Barlow Condensed',sans-serif;
  letter-spacing:2px;text-transform:uppercase;font-size:13px}
</style>
</head>
<body>

<div class="glow"></div>

<header class="bar" id="bar">
  <div class="bar-name">TBR <span>TOOLS</span></div>
  <div class="bar-search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" id="q" placeholder="Buscar producto o código…" oninput="filterProducts()">
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <div class="hero-co" id="heroCo">Alexis Sebastián Tobares</div>
    <h1 class="hero-title">Catálogo<br><span class="gd">Digital</span></h1>
    <p class="hero-sub">Herramientas y equipos seleccionados, con precios actualizados al día de hoy. Tocá un producto para ver el detalle y consultanos por WhatsApp.</p>
    <div class="hero-meta" id="heroMeta"></div>
  </div>
  <div class="hero-scroll">
    <div class="hero-scroll-line"></div>
    <div class="hero-scroll-t">Ver productos</div>
  </div>
</section>

<main class="section">
  <div class="grid" id="grid"></div>
</main>

<footer class="foot">
  <div class="foot-co"><b>TBR Tools</b> · Catálogo actualizado al <span id="footDate"></span></div>
  <a class="foot-cta" href="#" id="waCta" target="_blank" rel="noopener">Consultar por WhatsApp</a>
</footer>

<script>
/* ════════════════════════════════════════════════════
   FUENTE DE DATOS
   Reemplazar/alimentar este array desde TBR Tools Manager
   (mismo formato que el catálogo de la app):
   { name, code, salePrice, stock, photo }
   - photo: dataURL/base64 o URL de imagen (opcional)
   - stock: número (opcional, omitir si no se controla stock)
═════════════════════════════════════════════════════ */
const EMPRESA = {
  nombre: 'Alexis Sebastián Tobares',
  whatsapp: '5492604375765',
};

const PRODUCTS = [
  {name:'Amoladora Inalámbrica 20V 1000W Total', code:'TAGLI271532', salePrice:280622, stock:5},
  {name:'Taladro Percutor Inalámbrico 20V 86Nm Total', code:'TIDLI208687', salePrice:275425, stock:1},
  {name:'Taladro Atornillador Inalámbrico 20V 50Nm Total', code:'TDLI205062', salePrice:176688, stock:5},
  {name:'Equipo De Pintar 530W 800ML Total', code:'TT45061', salePrice:75448, stock:4},
  {name:'Equipo De Pintar 450W 800ML Total', code:'TT3506', salePrice:69290, stock:3},
];

const fmtA = n => '$ ' + Math.round(n||0).toLocaleString('es-AR');
const esc = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function stockBadge(c){
  if(c.stock==null) return '';
  if(c.stock<=0) return '<div class="ph-badge r">Sin stock</div>';
  if(c.stock<=2) return `<div class="ph-badge y">Stock bajo · ${c.stock}</div>`;
  return `<div class="ph-badge g">Stock · ${c.stock}</div>`;
}

function cardHTML(c, i){
  const feat = i===0 ? ' feat' : '';
  const photo = c.photo
    ? `<img src="${c.photo}" alt="${esc(c.name)}" loading="lazy">`
    : `<div class="ph-ph">${esc((c.name||'?').slice(0,1).toUpperCase())}</div>`;
  return `<article class="card${feat}" data-name="${esc(c.name).toLowerCase()}" data-code="${esc(c.code||'').toLowerCase()}">
    <div class="ph">${photo}${stockBadge(c)}</div>
    <div class="card-body">
      <div class="card-name">${esc(c.name)}</div>
      ${c.code?`<div class="card-code">${esc(c.code)}</div>`:''}
      <div class="card-price">${fmtA(c.salePrice)}</div>
    </div>
  </article>`;
}

function render(){
  const grid = document.getElementById('grid');
  if(!PRODUCTS.length){
    grid.innerHTML = '<div class="empty">Catálogo vacío</div>';
    return;
  }
  grid.innerHTML = PRODUCTS.map(cardHTML).join('');
  observeCards();
}

function observeCards(){
  const cards = [...document.querySelectorAll('.card')];
  if('IntersectionObserver' in window){
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(en=>{
        if(en.isIntersecting){
          const el = en.target;
          const i = cards.indexOf(el);
          el.style.transitionDelay = (Math.min(i % 6, 5) * 70) + 'ms';
          el.classList.add('in');
          io.unobserve(el);
        }
      });
    }, {threshold:.12, rootMargin:'0px 0px -40px 0px'});
    cards.forEach(c=>io.observe(c));
  } else {
    cards.forEach(c=>c.classList.add('in'));
  }
}

function filterProducts(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  document.querySelectorAll('.card').forEach(c=>{
    const match = !q || c.dataset.name.includes(q) || c.dataset.code.includes(q);
    c.style.display = match ? '' : 'none';
  });
}

function heroMeta(){
  const total = PRODUCTS.length;
  const sinStock = PRODUCTS.filter(p=>p.stock!=null && p.stock<=0).length;
  const disponibles = total - sinStock;
  document.getElementById('heroMeta').innerHTML = `
    <div><b>${total}</b><span>Producto${total===1?'':'s'}</span></div>
    <div><b>${disponibles}</b><span>Disponibles</span></div>
  `;
}

function setupBar(){
  const bar = document.getElementById('bar');
  const onScroll = () => bar.classList.toggle('on', window.scrollY > window.innerHeight * .6);
  document.addEventListener('scroll', onScroll, {passive:true});
  onScroll();
}

function setupFooter(){
  document.getElementById('heroCo').textContent = EMPRESA.nombre;
  document.getElementById('footDate').textContent = new Date().toLocaleDateString('es-AR', {day:'numeric',month:'long',year:'numeric'});
  const msg = encodeURIComponent(`Hola! Te escribo por el catálogo de ${EMPRESA.nombre} 🙂`);
  document.getElementById('waCta').href = `https://wa.me/${EMPRESA.whatsapp}?text=${msg}`;
}

render();
heroMeta();
setupBar();
setupFooter();
</script>
</body>
</html>
